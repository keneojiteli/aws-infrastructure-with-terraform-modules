name: Automate terraform operations with GHA 

#  push to main branch triggers workflow
on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

jobs:
  terraform:
    name: Terraform init, plan & apply
    runs-on: ubuntu-latest

    env:
      TF_VAR_db_password: ${{ secrets.RDS_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # connects to s3 backend
      - name: Terraform Init
        run: terraform init

      # formats my code to respect best practices
      - name: Terraform Format Check
        run: terraform fmt -recursive

      # verify the correctness of terraform config files
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # checks what changes will occur
      - name: Terraform Plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      # Provisions infrastructure
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
